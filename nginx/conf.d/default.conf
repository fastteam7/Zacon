# =============================================================================
# ZACON - Server Configuration (Optimized for SEO & Performance)
# =============================================================================

# Upstream para a aplicação Next.js
upstream nextjs_upstream {
    server app:3000;
    keepalive 64;
}

# Redirect HTTP para HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name zacon.com.br www.zacon.com.br;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect para HTTPS (non-www)
    location / {
        return 301 https://zacon.com.br$request_uri;
    }
}

# Redirect www para non-www (SEO - canonical domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.zacon.com.br;

    ssl_certificate /etc/letsencrypt/live/zacon.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zacon.com.br/privkey.pem;

    return 301 https://zacon.com.br$request_uri;
}

# HTTPS Server Principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zacon.com.br;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/zacon.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zacon.com.br/privkey.pem;

    # SSL Configuration - Otimizado
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_buffer_size 4k;

    # Modern SSL Configuration (A+ no SSL Labs)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HSTS (2 anos)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers adicionais para SEO
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root
    root /var/www/html;

    # Proxy para Next.js - Main
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;

        # Cache de páginas HTML (1 hora para conteúdo dinâmico)
        proxy_cache STATIC;
        proxy_cache_revalidate on;
        proxy_cache_min_uses 1;
        proxy_cache_use_stale error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache agressivo para assets do Next.js (imutáveis)
    location /_next/static {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 1 ano (imutável)
        proxy_cache STATIC;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache para imagens otimizadas do Next.js
    location /_next/image {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 30 dias
        proxy_cache STATIC;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache para data do Next.js
    location /_next/data {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 1 hora
        proxy_cache STATIC;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache para imagens estáticas
    location ~* \.(jpg|jpeg|png|gif|ico|webp|avif|svg)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 30 dias
        proxy_cache STATIC;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        expires 30d;
        access_log off;
    }

    # Cache para fontes
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 1 ano
        proxy_cache STATIC;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        expires 1y;
        access_log off;
    }

    # Cache para CSS e JS estáticos
    location ~* \.(css|js)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 7 dias
        proxy_cache STATIC;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
    }

    # Sitemap e robots.txt - Cache curto
    location ~* (sitemap\.xml|robots\.txt)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 1 dia
        proxy_cache STATIC;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Favicon e manifest
    location ~* \.(ico|webmanifest)$ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache de 7 dias
        proxy_cache STATIC;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Bloquear acesso a arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(\.git|\.env|\.config|node_modules) {
        deny all;
        return 404;
    }
}
